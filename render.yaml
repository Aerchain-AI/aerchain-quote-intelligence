services:
  # Backend API Service
  - type: web
    name: aerchain-api
    env: node
    plan: free
    rootDir: services/api
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        value: file:./dev.db
      - key: GEMINI_API_KEYS
        sync: false

  # Frontend Web Service
  - type: web
    name: aerchain-web
    env: static
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: aerchain-api
          envVarKey: RENDER_EXTERNAL_URL
